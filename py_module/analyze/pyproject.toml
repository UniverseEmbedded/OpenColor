[project]
name = "oc_analyze"
version = "0.1.0"
description = "OpenColor 调试分析模块"
dependencies = ["numpy", "lxml", "pillow", "trimesh", "opencv-python", "oc_core", "oc_engine", "oc_scripts"]
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oc_analyze"]
