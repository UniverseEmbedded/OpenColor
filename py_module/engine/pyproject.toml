[project]
name = "oc_engine"
version = "0.1.0"
description = "OpenColor 执行引擎模块"
dependencies = ["numpy", "lxml", "pillow", "trimesh", "opencv-python", "oc_core"]
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oc_engine"]
