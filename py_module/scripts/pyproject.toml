[project]
name = "oc_scripts"
version = "0.1.0"
description = "OpenColor 工具脚本模块"
dependencies = ["numpy", "lxml", "pillow", "trimesh", "opencv-python", "oc_core", "model_export", "oc_calib"]
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oc_scripts"]
