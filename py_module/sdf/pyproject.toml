[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "oc_sdf"
version = "0.1.0"
description = "OpenColor SDF 模块 - 基于符号距离场的位图到3D网格转换算法"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OpenColor" }]

dependencies = [
  "numpy>=1.24",
  "pillow>=10.0.0",
  "trimesh>=4.0.0",
  "shapely>=2.0.0",
  "opencv-python>=4.8.0",
  "svgpathtools>=1.6.0",
  "scipy>=1.11.0",
]

[project.optional-dependencies]
vtracer = ["vtracer>=0.6.0"]
bitmap2svg = ["rgbw_bitmap2svg"]

[tool.hatch.build.targets.wheel]
packages = ["src/oc_sdf"]
